[package]
name = "narration-studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native Linux desktop app that turns long prose into multi-voice narration via ElevenLabs, with per-segment review."
publish = false

[dependencies]
anyhow = "1.0.104"
# Text-to-Dialogue returns its audio as base64.
base64 = "0.23"
directories = "6.0.0"
eframe = "0.37"
env_logger = "0.11.11"
hex = "0.4.3"
hound = "3.5"
# Unicode normalisation for checking dialogue alignments (already in the tree via idna).
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
libc = "0.2"
log = "0.4.34"
rand = "0.10.3"
reqwest = { version = "0.13", features = ["json"] }
rfd = "0.17.2"
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.11.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
# Local take check (feature `whisper`); log_backend routes whisper.cpp logs into `log`.
whisper-rs = { version = "0.16", features = ["log_backend"], optional = true }

[features]
default = ["whisper"]
# Local Whisper take check. Building it needs cmake, a C++ compiler and libclang.
whisper = ["dep:whisper-rs"]

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2
